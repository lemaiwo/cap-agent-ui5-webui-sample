_schema-version: "3.1"
ID: cap-agent-ui5-webui-sample
version: 1.0.0
description: Sample CAP app using the cap-agent-ui5-webui plugin

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # The CAP service. It also serves the chat UI at /chat, because the plugin
  # mounts its prebuilt assets on the CDS server itself - which is why there is
  # no HTML5 Application Repository module anywhere in this file.
  - name: sample-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sample-db
      - name: sample-auth
      - name: sample-aicore

  # Deploys the CDS model into the HDI container.
  - name: sample-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sample-db

  # The approuter exists for LOGIN, not for serving the UI.
  #
  # The plugin serves /chat itself, same-origin from the CAP service, so no
  # approuter is needed to deliver the assets. But XSUAA-protected endpoints
  # need an OAuth flow a browser can follow, and CAP's own auth middleware only
  # rejects with 401 - it cannot redirect a user to log in. That is what this
  # module provides.
  - name: sample-router
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sample-auth

resources:
  - name: sample-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: sample-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cap-agent-ui5-webui-sample-${org}-${space}

  # An AI Core instance that already exists in the space - the sample binds to
  # it rather than creating one, so deploying does not provision AI resources.
  # Change the name if yours is called something else.
  - name: sample-aicore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: aicore
