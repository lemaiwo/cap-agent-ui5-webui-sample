_schema-version: "3.1"
ID: cap-agent-ui5-webui-sample
version: 1.0.0
description: Sample CAP app using the cap-agent-ui5-webui plugin

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # The CAP service.
  #
  # Deployed, it does NOT serve the chat UI: the production profile sets
  # cap-agent-ui5-webui.serveUi:false, and the UI comes from the HTML5
  # Application Repository below instead. What the plugin still serves here is
  # /chat/agents.json, which is generated at runtime from the services carrying
  # @agent - no static artifact can stand in for it. Locally serveUi stays true,
  # so `npm run dev` needs none of this.
  - name: sample-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sample-db
      - name: sample-auth
      - name: sample-aicore

  # Deploys the CDS model into the HDI container.
  - name: sample-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sample-db

  # The chat UI, packaged for the HTML5 Application Repository.
  #
  # app/chat-ui/dist is GENERATED - `npm run build` regenerates it from the
  # installed plugin (`cap-agent-ui5-webui html5`), which copies the prebuilt
  # UI and writes the xs-app.json that routes agents.json back to the CAP
  # service. It is gitignored; never edit it by hand.
  #
  # The module name becomes the artifact name (capagentuichat.zip) referenced
  # by the content deployer below. supported-platforms: [] keeps it from being
  # pushed as a Cloud Foundry app - its only output is content for the
  # repository.
  # build-result must name the folder holding the built app. Left at its
  # default (the module path) mbt looks for capagentuichat.zip in app/chat-ui,
  # finds nothing, copies nothing, and the content module below uploads an
  # empty archive - which the repository rejects with the very unhelpful
  # "Could not find applications in the request".
  - name: capagentuichat
    type: html5
    path: app/chat-ui
    build-parameters:
      builder: custom
      commands: []
      build-result: dist
      supported-platforms: []

  # Uploads the built app into the app-host instance. This is a one-off task,
  # not a running app - it stops after it has deployed the content.
  - name: sample-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: sample-html5-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - capagentuichat.zip
          name: capagentuichat
          target-path: resources/

  # The approuter: login, and now also delivery of the UI from the repository.
  #
  # XSUAA-protected endpoints need an OAuth flow a browser can follow, and CAP's
  # own auth middleware only rejects with 401 - it cannot redirect a user to log
  # in. Binding sample-html5-runtime is what additionally lets this approuter
  # serve app content out of the repository; without it the app path 404s.
  - name: sample-router
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sample-auth
      - name: sample-html5-runtime

resources:
  - name: sample-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # xs-security.json carries oauth2-configuration.redirect-uris. Without it the
  # approuter's redirect_uri (https://<router>/login/callback) is not
  # whitelisted, and login dies after the user has already typed their password
  # with "OpenID provider cannot process the request due to configuration
  # issues" - which reads like a broken IdP trust rather than a missing entry
  # here. XSUAA only validates redirect_uri AFTER authenticating, so an
  # anonymous request reaching the login page proves nothing about it.
  #
  # Note that XSUAA parses that file strictly and rejects unknown keys - a "//"
  # comment array fails the whole update. Keep xs-security.json free of
  # comments; explanations go here instead. A rejected update leaves the
  # instance on its previous config, so run `npm run verify:deploy` afterwards.
  - name: sample-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cap-agent-ui5-webui-sample-${org}-${space}

  # Stores the chat UI's files. app-host is the write side: the content
  # deployer uploads into it.
  - name: sample-html5-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      config:
        sizeLimit: 5

  # The read side, bound to the approuter so it can serve what the app-host
  # instance holds. Two instances of one service, deliberately: they are
  # different halves of the same thing.
  - name: sample-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # An AI Core instance that already exists in the space - the sample binds to
  # it rather than creating one, so deploying does not provision AI resources.
  # Change the name if yours is called something else.
  - name: sample-aicore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: aicore
